name: Upwind Manual Image Scan

# Build each service image on the runner and scan with Upwind Shift Left.
# Secrets: UPWIND_CLIENT_ID, UPWIND_CLIENT_SECRET

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to scan
        type: choice
        options:
          - all
          - frontend
          - chat-rag
          - board-generator
        default: all
      image_tag:
        description: Local image tag suffix
        type: string
        default: latest
      fail_on_scan_error:
        description: Fail the job if the scan cannot complete
        type: boolean
        default: true
      enforce_block_policy:
        description: Fail when Upwind PR-block policy is violated
        type: boolean
        default: false

concurrency:
  group: upwind-scan-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  NAME_PREFIX: jays-surf-shop-demo

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(
          inputs.service == 'all'
          && '["frontend","chat-rag","board-generator"]'
          || format('["{0}"]', inputs.service)
          ) }}
    steps:
      - name: Check Upwind credentials
        env:
          UPWIND_CLIENT_ID: ${{ secrets.UPWIND_CLIENT_ID }}
          UPWIND_CLIENT_SECRET: ${{ secrets.UPWIND_CLIENT_SECRET }}
        run: |
          if [ -z "$UPWIND_CLIENT_ID" ] || [ -z "$UPWIND_CLIENT_SECRET" ]; then
            echo "::error::Add UPWIND_CLIENT_ID and UPWIND_CLIENT_SECRET to this repo's Actions secrets."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Resolve build context
        id: ctx
        run: |
          case "${{ matrix.service }}" in
            frontend)         echo "context=frontend" ;;
            chat-rag)         echo "context=services/chat-rag" ;;
            board-generator)  echo "context=services/board-generator" ;;
            *) echo "::error::Unknown service: ${{ matrix.service }}"; exit 1 ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ steps.ctx.outputs.context }}
          load: true
          tags: ${{ env.NAME_PREFIX }}-${{ matrix.service }}:${{ inputs.image_tag }}
          cache-from: type=gha,scope=scan-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=scan-${{ matrix.service }}

      - name: Shift Left Image Scan
        uses: upwindsecurity/shiftleft-create-image-scan-event-action@main
        with:
          upwind_client_id: ${{ secrets.UPWIND_CLIENT_ID }}
          upwind_client_secret: ${{ secrets.UPWIND_CLIENT_SECRET }}
          docker_image: ${{ env.NAME_PREFIX }}-${{ matrix.service }}:${{ inputs.image_tag }}
          pull_image: false
          use_sudo: false
          commit_sha: ${{ github.sha }}
          fail_on_scan_error: ${{ inputs.fail_on_scan_error }}
          enforce_block_policy: ${{ inputs.enforce_block_policy }}
